<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org">
<link rel="stylesheet" href="leaflet.css">
<style>
  :root { color-scheme:light; --map:#dfe5ed; --card:#fff; --ink:#242d40; --accent:#435e94; }
  :root.dark { color-scheme:dark; --map:#19283d; --card:#1c2a40; --ink:#edf3ff; --accent:#adc8ff; }
  body { height:100vh; margin:0; display:flex; flex-direction:column; color:var(--ink); font-family:system-ui,sans-serif; }
  #map { flex:1; min-height:0; background:var(--map); }
  .dark .leaflet-basemap-pane { filter:invert(1) hue-rotate(180deg) saturate(.65) brightness(.86); }
  #map .leaflet-control-attribution { font-size:10px; }
  .dark #map .leaflet-control-attribution, .dark .leaflet-bar a { background:var(--card); color:var(--ink); }
  a { color:var(--accent); }
  #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:800;
    text-align:center; background:var(--card); border-radius:8px; padding:6px 10px; font-size:12px; box-shadow:0 1px 5px #0002; }
  .controls { padding:12px 16px; background:var(--card); font-size:14px; }
  .line { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .legend { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:12px; }
  .scale { height:8px; flex:1; border-radius:4px; background:linear-gradient(to right,#4a9c68,#6dde74,#f4d54c,#f15b44); }
</style>
</head>
<body>
  <div id="map" role="region"></div>
  <div id="status" role="status" hidden></div>
  <section class="controls">
    <div class="line"><output id="forecast"></output><a id="source">NOAA SWPC</a></div>
    <div class="legend"><span id="low"></span><span class="scale"></span><span id="high"></span></div>
  </section>
  <script src="leaflet.js"></script>
  <script src="aurora.js"></script>
</body>
</html>
