<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://s3-prod-dpc-radar-webp-cache.s3.eu-south-1.amazonaws.com">
<link rel="stylesheet" href="leaflet.css">
<style>
  * { box-sizing: border-box; }
  :root { color-scheme:light; --page:#e5eefb; --card:#fff; --map:#dfe5ed; --ink:#242d40; --muted:#546074; --accent:#435e94; }
  :root.dark { color-scheme:dark; --page:#111d30; --card:#1c2a40; --map:#19283d; --ink:#edf3ff; --muted:#b0bed4; --accent:#adc8ff; }
  body { height:100vh; margin:0; display:flex; flex-direction:column; background:var(--page); color:var(--ink); font-family:system-ui,sans-serif; }
  #map { flex:1; min-height:0; background:var(--map); }
  .dark .leaflet-basemap-pane { filter:invert(1) hue-rotate(180deg) saturate(.65) brightness(.86); }
  #map .leaflet-control-attribution { font-size:10px; }
  .dark #map .leaflet-control-attribution, .dark .leaflet-bar a { background:#1c2a40; color:var(--ink); }
  .dark #map .leaflet-control-attribution a { color:var(--accent); }
  .dark .leaflet-bar a { border-bottom-color:#435470; }
  #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); max-width:75%; z-index:800;
    text-align:center; background:var(--card); border-radius:8px; padding:6px 10px; font-size:12px; box-shadow:0 1px 5px #0002; }
  #status[hidden] { display:none; }
  .controls { padding:10px 16px 12px; background:var(--card); }
  .line, .range, .legend { display:flex; align-items:center; gap:10px; }
  .line { justify-content:space-between; }
  #frame { font-variant-numeric:tabular-nums; font-weight:600; }
  button { min-width:44px; min-height:44px; border:0; border-radius:10px; color:var(--accent); background:var(--page); font-size:18px; }
  button:disabled { opacity:.45; }
  #lightning { min-height:36px; padding:0 10px; font-size:13px; white-space:nowrap; }
  #lightning[aria-pressed="true"] { color:var(--ink); background:var(--page); }
  #lightning[aria-pressed="false"] { color:var(--muted); background:transparent; }
  .lightning-icon { color:#e49414; }
  .lightning-strike { pointer-events:none; filter:drop-shadow(0 0 1px #512d0c) drop-shadow(0 0 1px #512d0c); }
  .lightning-strike span { display:block; width:100%; height:100%; background:#ffcf3b;
    clip-path:polygon(59% 0, 13% 57%, 48% 57%, 33% 100%, 89% 40%, 56% 40%, 73% 0); }
  input { width:100%; margin:0; accent-color:var(--accent); }
  .range { padding-right:22px; }
  .range-labels { padding:0 22px 0 54px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .legend { flex-wrap:wrap; margin-top:9px; color:var(--muted); font-size:11px; }
  .key { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .swatch { width:11px; height:11px; border-radius:2px; }
  .city-marker { pointer-events:none; }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="status" role="status"></div>
  <section class="controls">
    <div class="line"><span id="label"></span><button id="lightning" type="button" aria-pressed="true"><span class="lightning-icon" aria-hidden="true">⚡</span> <span id="lightning-label"></span></button><output id="frame" for="timeline">—</output></div>
    <div style="min-height:1.4em;font-size:12px"><output id="map-updated" hidden></output></div>
    <div class="range"><button id="play" disabled>▶</button><input id="timeline" type="range" min="0" max="12" value="12" disabled></div>
    <div class="range-labels"><span>−60 min</span><span id="latest"></span></div>
    <div class="legend" id="legend"></div>
  </section>
  <script src="leaflet.js"></script>
  <script src="map.js"></script>
  <script src="radar.js"></script>
</body>
</html>
