plugins {
    id 'com.android.application' version '8.5.2'
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

if (file('src/release/google-services.json').isFile() || file('src/debug/google-services.json').isFile()) {
    apply plugin: 'com.google.gms.google-services'
    googleServices {
        missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
}

def gitBuild = rootProject.file('.git').exists() ? providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.get().trim() : ''
def buildDate = java.time.LocalDate.now().toString()
def releaseVersion = '0.4.1'

android {
    namespace 'it.skynow.app'
    compileSdk 34
    defaultConfig {
        applicationId 'it.skynow.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName(gitBuild ? "${releaseVersion}+${gitBuild}" : releaseVersion)
        resValue 'string', 'sky_version_name', versionName
        resValue 'string', 'sky_version_date', buildDate
        resValue 'bool', 'check_for_release_updates', 'true'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            resValue 'bool', 'check_for_release_updates', 'false'
        }
    }
}
